[project]
name = "brushsynth"
version = "0.0.1"
description = "Brush-native drum controller and physical-model synthesizer"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sounddevice>=0.4.6",
    "numba>=0.59",
    "soundfile>=0.12",
    "pygame>=2.5",
    "matplotlib>=3.8",
    "pydub>=0.25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
]
analysis = [
    "librosa>=0.10",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brushsynth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
