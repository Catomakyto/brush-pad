# pio run -d firmware/brushpad -e half_16x8 -t upload
[env]
platform = teensy
board = teensy40
framework = arduino
upload_protocol = teensy-cli
build_src_filter = +<*> -<diag.cpp>

[env:teensy40]

[env:bringup_1x1]
build_flags = -DNROWS=1 -DNCOLS=1

[env:bringup_1x4]
build_flags = -DNROWS=1 -DNCOLS=4

[env:bringup_1x8]
build_flags = -DNROWS=1 -DNCOLS=8

[env:half_16x8]
build_flags = -DNROWS=16 -DNCOLS=8

[env:bringup_16x1]
build_flags = -DNROWS=16 -DNCOLS=1

# Mux and ADC wiring check
[env:diag]
build_src_filter = +<diag.cpp>
